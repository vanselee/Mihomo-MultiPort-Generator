<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihomo 多端口分流配置生成器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 js-yaml 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">🚀 Mihomo 多端口配置生成器</h1>
            <p class="text-gray-500 text-sm">一键将 Clash 节点转换为多端口独立配置（彻底解决浏览器 CORS 跨域限制）</p>
        </div>

        <div class="space-y-6">
            <div>
                <label for="yaml-input" class="block text-sm font-medium text-gray-700 mb-2">
                    请将你的 Clash 配置文件（YAML）内容粘贴在下方：
                    <span class="block font-normal text-gray-500 mt-1">小提示：你可以在 Clash Verge 中右键你的订阅 ->「编辑文件」，将里面的内容全选复制即可。</span>
                </label>
                <textarea id="yaml-input" rows="8" placeholder="proxies:&#10;  - name: 节点1&#10;    type: vmess&#10;    ..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-mono text-sm resize-y"></textarea>
            </div>

            <button id="generate-btn" onclick="generateConfig()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center">
                <span id="btn-text">立即转换并下载配置文件</span>
            </button>

            <div id="status-message" class="text-center text-sm font-medium hidden mt-4"></div>
        </div>

        <div class="mt-10 bg-green-50 text-green-800 p-4 rounded-lg text-sm leading-relaxed">
            <h3 class="font-bold mb-2">💡 为什么采用“粘贴文本”的方式？(方案一)</h3>
            <p>由于浏览器的严格跨域限制（CORS），网页直接请求订阅链接极易被墙或拦截导致 <code>Failed to fetch</code>。直接在本地处理你粘贴的文本是 <strong>100% 成功、速度最快且最保护隐私</strong> 的方案，数据绝对不会上传到任何服务器。</p>
        </div>
    </div>

    <script>
        function generateConfig() {
            const yamlInput = document.getElementById('yaml-input').value.trim();
            const btnText = document.getElementById('btn-text');
            const generateBtn = document.getElementById('generate-btn');
            const statusMsg = document.getElementById('status-message');

            if (!yamlInput) {
                showStatus("输入框不能为空，请粘贴你的 Clash YAML 文本！", "text-red-600");
                return;
            }

            try {
                // 解析 YAML
                const data = jsyaml.load(yamlInput);
                if (!data || !data.proxies) {
                    throw new Error("解析失败：未找到 proxies 节点。请确保你粘贴的是正确的 Clash YAML 格式代码，而不是网址或乱码。");
                }

                // 取前 50 个节点
                const proxies = data.proxies.slice(0, 50);
                
                let listeners = [];
                let rules = [];
                let startPort = 10001;

                // 构建数据
                proxies.forEach((proxy, i) => {
                    proxy['skip-cert-verify'] = true;
                    let port = startPort + i;
                    let oldName = proxy['name'];
                    let newName = `[${port}] ${oldName}`;
                    proxy['name'] = newName;

                    listeners.push({
                        name: `inbound-${port}`,
                        type: 'mixed',
                        port: port
                    });

                    rules.push(`IN-PORT,${port},${newName}`);
                });

                rules.push("MATCH,DIRECT");

                const newConfig = {
                    'allow-lan': true,
                    'mode': 'rule',
                    'log-level': 'info',
                    'proxies': proxies,
                    'listeners': listeners,
                    'rules': rules
                };

                // 转换为 YAML 文本
                const newYamlText = jsyaml.dump(newConfig, { 
                    noRefs: true, 
                    lineWidth: -1,
                    styles: { '!!null': 'empty' } // 保持原本格式
                });

                // 触发下载
                const blob = new Blob([newYamlText], { type: 'text/yaml;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'mihomo_multi_port.yaml';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showStatus(`✅ 成功生成并下载！共为你分配了 ${proxies.length} 个节点端口。`, "text-green-600");

            } catch (error) {
                console.error(error);
                showStatus(`❌ 生成错误: ${error.message}`, "text-red-600");
            }
        }

        function showStatus(text, colorClass) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.innerText = text;
            statusMsg.className = `text-center text-sm font-medium mt-4 ${colorClass}`;
            statusMsg.classList.remove("hidden");
        }
    </script>
</body>
</html>
